<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Portal - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="login-page">

        <div class="login-card">


            <!-- =====================================
                 LEFT BRAND SECTION
            ====================================== -->

            <div class="login-brand">

                <div class="brand-icon">
                    🎓
                </div>

                <h1>
                    Student Portal
                </h1>

                <p>
                    Your academic information,
                    activities and queries
                    in one place.
                </p>

                <div class="brand-features">

                    <div class="brand-feature">
                        <span>✓</span>
                        Academic Dashboard
                    </div>

                    <div class="brand-feature">
                        <span>✓</span>
                        Student Queries
                    </div>

                    <div class="brand-feature">
                        <span>✓</span>
                        Easy & Secure Access
                    </div>

                </div>

            </div>


            <!-- =====================================
                 RIGHT LOGIN SECTION
            ====================================== -->

            <div class="login-section">

                <div class="login-box">


                    <div class="login-header">

                        <h2>
                            Welcome Back
                        </h2>

                        <p>
                            Sign in to continue
                            to your dashboard
                        </p>

                    </div>


                    <!-- =================================
                         LOGIN ROLE
                    ================================== -->

                    <div class="form-group">

                        <label>
                            Login As
                        </label>


                        <div class="role-selector">

                            <button
                                type="button"
                                id="studentRoleButton"
                                class="role-button active"
                                data-role="student"
                            >
                                Student
                            </button>


                            <button
                                type="button"
                                id="adminRoleButton"
                                class="role-button"
                                data-role="admin"
                            >
                                Admin
                            </button>

                        </div>


                        <input
                            type="hidden"
                            id="role"
                            value="student"
                        >

                    </div>


                    <!-- =================================
                         LOGIN FORM
                    ================================== -->

                    <form
                        id="loginForm"
                        autocomplete="on"
                    >


                        <!-- USERNAME -->

                        <div class="form-group">

                            <label
                                for="username"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="form-group">

                            <label
                                for="password"
                            >
                                Password
                            </label>


                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >


                                <button
                                    type="button"
                                    id="passwordToggle"
                                    class="password-toggle"
                                >
                                    Show
                                </button>

                            </div>

                        </div>


                        <!-- FORGOT PASSWORD -->

                        <div class="forgot-row">

                            <button
                                type="button"
                                id="forgotPassword"
                                class="forgot-button"
                            >
                                Forgot Password?
                            </button>

                        </div>


                        <!-- LOGIN MESSAGE -->

                        <div
                            id="loginMessage"
                            class="login-message"
                        ></div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="login-button"
                        >
                            Login
                        </button>
                    </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        src="script.js"
    ></script>

</body>

</html>
